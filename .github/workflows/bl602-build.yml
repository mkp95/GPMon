name: BL602 firmware build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out GPMon
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build python3 python3-pip \
            python3-venv git curl xz-utils device-tree-compiler

      - name: Install Bouffalo SDK
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/bouffalolab/bouffalo_sdk.git "$RUNNER_TEMP/bouffalo_sdk"
          echo "BL_SDK_BASE=$RUNNER_TEMP/bouffalo_sdk" >> "$GITHUB_ENV"

      - name: Install T-Head RISC-V toolchain
        run: |
          curl --fail --location --retry 3 \
            https://github.com/bouffalolab/toolchain/releases/download/default/xuantie-gcc-riscv-v2.6.1-linux-x86_64.tar.xz \
            --output "$RUNNER_TEMP/xuantie-toolchain.tar.xz"
          echo "83817bd7cab693fc249bb98869de5e475c1ede577f4a188869fed96c8dbb8e1a  $RUNNER_TEMP/xuantie-toolchain.tar.xz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/thead-toolchain"
          tar -xJf "$RUNNER_TEMP/xuantie-toolchain.tar.xz" -C "$RUNNER_TEMP/thead-toolchain" --strip-components=1
          echo "$RUNNER_TEMP/thead-toolchain/bin" >> "$GITHUB_PATH"

      - name: Build BL602 firmware
        run: |
          make CHIP=bl602 BOARD=bl602dk
